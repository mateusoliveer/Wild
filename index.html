<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arena Selvagem</title>
<style>
:root{--bg:#0d1a12;--fg:#fff;--btn:rgba(20,30,50,.75);--line:#9cf}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
.b{position:fixed;border-radius:50%;background:var(--btn);border:2px solid var(--line);color:var(--fg);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
#a{right:22px;bottom:22px;width:84px;height:84px;border-color:#fc6}
#q{right:120px;bottom:16px;width:60px;height:60px}
#w{right:104px;bottom:88px;width:60px;height:60px}
#r{right:30px;bottom:120px;width:60px;height:60px;border-color:#f6c}
.off{opacity:.45}
#end{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:36px;font-weight:800}
#end button{font-size:18px;padding:12px 28px;border-radius:10px;border:0;background:#4aa3ff;color:#fff;font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="b" id="a">ATQ</div><div class="b" id="q">Q</div><div class="b" id="w">W</div><div class="b" id="r">R</div>
<div id="end"><span id="et"></span><button onclick="location.reload()">Jogar de novo</button></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=2400,H=700,$=i=>document.getElementById(i);
let vw,vh,sc,dpr;
function rs(){dpr=devicePixelRatio||1;vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;sc=Math.min(vh/700,vw/800)}
addEventListener('resize',rs);rs();
const S={hero:{hp:650,dmg:55,rg:170,cd:.8,r:22,sp:230},mel:{hp:260,dmg:14,rg:30,cd:1,r:13,sp:105},rng:{hp:170,dmg:20,rg:170,cd:1.3,r:11,sp:105},tow:{hp:2000,dmg:95,rg:300,cd:1.1,r:38,sp:0},nex:{hp:3000,dmg:0,rg:0,cd:1,r:60,sp:0}};
let U=[],FX=[],PR=[],over='',time=0,wave=3;
const COL=['#4aa3ff','#ff5a5a'],dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function mk(t,team,x,y){const u={t,team,x,y,...S[t],max:S[t].hp,at:0,dead:0,lvl:1,xp:0,k:0,fx:team?-1:1,fy:0,q:0,w:0,u:0};U.push(u);return u}
mk('nex',0,150,350);mk('tow',0,750,350);mk('nex',1,2250,350);mk('tow',1,1650,350);
const P=mk('hero',0,290,350),B=mk('hero',1,2110,350);
const prot=o=>o.t=='nex'&&U.some(t=>t.t=='tow'&&t.team==o.team);
const foe=(u,o)=>o.team!=u.team&&!o.dead&&o.hp>0&&!prot(o);
function gainXp(h,n){h.xp+=n;while(h.xp>=h.lvl*100){h.xp-=h.lvl*100;h.lvl++;h.max+=90;h.hp+=90;h.dmg+=8;FX.push({x:h.x,y:h.y,r:60,t:.5,c:'#ff0'})}}
function hit(u,d,src){
  if(u.hp<=0||u.dead||prot(u))return;
  u.hp-=d;u.fl=.1;if(u.hp>0)return;
  const eh=u.team?P:B;
  if(!eh.dead&&(src==eh||dist(eh,u)<600))gainXp(eh,u.t=='hero'?150:u.t=='tow'?200:35);
  if(u.t=='hero'){u.dead=6+u.lvl*2;eh.k++}
  else if(u.t=='nex'){over=u.team?'VITÓRIA!':'DERROTA';$('et').textContent=over;$('end').style.display='flex'}
  else u.gone=1;
}
function mv(u,tx,ty,dt){const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy)||1;u.fx=dx/d;u.fy=dy/d;u.x+=u.fx*u.sp*dt;u.y+=u.fy*u.sp*dt}
function near(u,rg,pen){let tg=null,bs=1e9;for(const o of U){if(!foe(u,o))continue;const d=dist(u,o)-o.r;if(d>rg)continue;const s=d+(pen&&o.t=='hero'?1e3:0);if(s<bs){bs=s;tg=o}}return tg}
function shot(u,tg){hit(tg,u.dmg,u);FX.push({x:u.x,y:u.y,x2:tg.x,y2:tg.y,t:.12,c:COL[u.team]});u.at=u.cd}
function bolt(u,dx,dy){PR.push({x:u.x,y:u.y,vx:dx*620,vy:dy*620,team:u.team,dmg:70+25*u.lvl,life:.75,src:u})}
function ai(u,dt){
  if(u==B){
    if(u.hp<u.max*.3)u.run=1;if(u.hp>u.max*.85)u.run=0;
    if(u.run){if(u.x<2130)mv(u,2150,350,dt);return}
    const T=U.find(o=>o.t=='tow'&&o.team==0);
    if(T&&dist(u,T)<T.rg+70&&!U.some(m=>m.team==1&&m.t!='hero'&&dist(m,T)<T.rg)){mv(u,u.x+200,350,dt);return}
  }
  const tg=near(u,u.t=='tow'?u.rg:400,u.t=='tow');
  if(tg){
    const d=dist(u,tg)-tg.r;
    if(u==B&&tg.t=='hero'&&d<380&&u.q<=0){const l=dist(u,tg)||1;bolt(u,(tg.x-u.x)/l,(tg.y-u.y)/l);u.q=5}
    if(d<=u.rg){if(u.at<=0)shot(u,tg)}else if(u.sp)mv(u,tg.x,tg.y,dt);
  }else if(u.sp)mv(u,u.team?150:2250,350,dt);
}
// controles
let joy=null,jx=0,jy=0,atk=0;const keys={};
cv.addEventListener('pointerdown',e=>{if(!joy&&e.clientX<vw*.55)joy={id:e.pointerId,x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{if(joy&&e.pointerId==joy.id){let dx=e.clientX-joy.x,dy=e.clientY-joy.y,d=Math.hypot(dx,dy);if(d>50){dx*=50/d;dy*=50/d}jx=dx/50;jy=dy/50}});
const up=e=>{if(joy&&e.pointerId==joy.id){joy=null;jx=jy=0}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function cast(k){
  if(P.dead||over)return;
  if(k=='q'&&P.q<=0){const t=near(P,450);let dx=P.fx,dy=P.fy;if(t){const l=dist(P,t)||1;dx=(t.x-P.x)/l;dy=(t.y-P.y)/l;P.fx=dx;P.fy=dy}bolt(P,dx,dy);P.q=4}
  if(k=='w'&&P.w<=0){FX.push({x:P.x,y:P.y,r:30,t:.3,c:'#fff'});P.x+=P.fx*220;P.y+=P.fy*220;P.w=7}
  if(k=='r'&&P.u<=0&&P.lvl>=3){FX.push({x:P.x,y:P.y,r:210,t:.4,c:'#f6c'});for(const o of U)if(foe(P,o)&&dist(P,o)-o.r<210)hit(o,180+45*P.lvl,P);P.u=30}
}
for(const k of'qwr')$(k).addEventListener('pointerdown',e=>{e.preventDefault();cast(k)});
$('a').addEventListener('pointerdown',e=>{e.preventDefault();atk=1});
for(const ev of['pointerup','pointercancel','pointerleave'])$('a').addEventListener(ev,()=>atk=0);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k=='k')cast('q');if(k=='l')cast('w');if(k=='i')cast('r')});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function update(dt){
  time+=dt;wave+=dt;
  if(wave>=20){wave=0;for(const tm of[0,1])for(let i=0;i<3;i++)mk(i<2?'mel':'rng',tm,tm?2080+i*25:320-i*25,300+i*50)}
  for(const u of U){
    u.at-=dt;u.q-=dt;u.w-=dt;u.u-=dt;if(u.fl)u.fl=Math.max(0,u.fl-dt);
    if(u.t=='hero'){
      const bx=u.team?2110:290;
      if(u.dead){u.dead-=dt;if(u.dead<=0){u.dead=0;u.hp=u.max;u.x=bx;u.y=350}continue}
      u.hp=Math.min(u.max,u.hp+u.max*(Math.abs(u.x-bx)<220?.18:.006)*dt);
    }
    if(u==P){
      let mx=jx+(keys.d?1:0)-(keys.a?1:0),my=jy+(keys.s?1:0)-(keys.w?1:0),m=Math.hypot(mx,my);
      if(m>.15){if(m>1){mx/=m;my/=m}P.x+=mx*P.sp*dt;P.y+=my*P.sp*dt;m=Math.hypot(mx,my);P.fx=mx/m;P.fy=my/m}
      if((atk||keys.j)&&P.at<=0){const t=near(P,P.rg);if(t){const l=dist(P,t)||1;P.fx=(t.x-P.x)/l;P.fy=(t.y-P.y)/l;shot(P,t)}}
    }else ai(u,dt);
  }
  for(const a of U)if(a.sp&&!a.dead){for(const b of U)if(a!=b&&!b.dead){const d=dist(a,b),m=a.r+b.r;if(d<m&&d>0){const p=(m-d)*(b.sp?.5:1);a.x+=(a.x-b.x)/d*p;a.y+=(a.y-b.y)/d*p}}
    a.x=Math.max(30,Math.min(W-30,a.x));a.y=Math.max(70,Math.min(H-70,a.y))}
  for(const p of PR){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;for(const o of U)if(foe(p,o)&&dist(p,o)<o.r+12){hit(o,p.dmg,p.src);FX.push({x:p.x,y:p.y,r:30,t:.2,c:'#fff'});p.life=0;break}}
  PR=PR.filter(p=>p.life>0);U=U.filter(u=>!u.gone);
  for(const f of FX)f.t-=dt;FX=FX.filter(f=>f.t>0);
}
function bar(x,y,w,h,f,c){g.fillStyle='#000a';g.fillRect(x-w/2,y,w,h);g.fillStyle=c;g.fillRect(x-w/2,y,w*Math.max(0,f),h)}
function draw(){
  g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#0d1a12';g.fillRect(0,0,vw,vh);
  const hw=vw/2/sc,cx=hw*2>=W?W/2:Math.max(hw,Math.min(W-hw,P.x));
  g.save();g.translate(vw/2-cx*sc,vh/2-350*sc);g.scale(sc,sc);
  g.fillStyle='#1f4a2c';g.fillRect(0,0,W,H);g.fillStyle='#8a7a55';g.fillRect(0,250,W,200);
  g.fillStyle='#3d8bd966';g.fillRect(1150,0,100,H);
  for(const tm of[0,1]){g.fillStyle=COL[tm]+'33';g.beginPath();g.arc(tm?2250:150,350,260,0,7);g.fill()}
  if(atk&&!P.dead){g.strokeStyle='#fff4';g.lineWidth=2;g.beginPath();g.arc(P.x,P.y,P.rg+20,0,7);g.stroke()}
  for(const u of U){
    if(u.dead)continue;
    g.fillStyle=u.fl?'#fff':COL[u.team];g.strokeStyle='#000';g.lineWidth=3;g.beginPath();
    if(u.t=='tow')g.rect(u.x-u.r,u.y-u.r,u.r*2,u.r*2);
    else if(u.t=='nex'){g.moveTo(u.x,u.y-u.r);g.lineTo(u.x+u.r,u.y);g.lineTo(u.x,u.y+u.r);g.lineTo(u.x-u.r,u.y)}
    else g.arc(u.x,u.y,u.r,0,7);
    g.closePath();g.fill();g.stroke();
    if(u.t=='tow'){g.strokeStyle=COL[u.team]+'55';g.lineWidth=2;g.beginPath();g.arc(u.x,u.y,u.rg+20,0,7);g.stroke()}
    if(u.t=='hero'){g.strokeStyle=u==P?'#ff0':'#fff';g.lineWidth=3;g.beginPath();g.arc(u.x,u.y,u.r+5,0,7);g.stroke();
      g.fillStyle='#fff';g.beginPath();g.arc(u.x+u.fx*u.r,u.y+u.fy*u.r,6,0,7);g.fill();
      g.font='bold 16px system-ui';g.textAlign='center';g.fillText('Nv '+u.lvl,u.x,u.y-u.r-22)}
    const bw=u.t=='hero'?70:u.r*2.4;bar(u.x,u.y-u.r-16,bw,u.t=='hero'?9:5,u.hp/u.max,u.team?'#f55':'#5f7');
  }
  g.fillStyle='#fff';for(const p of PR){g.beginPath();g.arc(p.x,p.y,10,0,7);g.fillStyle=p.team?'#fa8':'#8ef';g.fill()}
  for(const f of FX){g.strokeStyle=f.c;g.lineWidth=4;g.globalAlpha=Math.min(1,f.t*4);g.beginPath();if(f.r)g.arc(f.x,f.y,f.r,0,7);else{g.moveTo(f.x,f.y);g.lineTo(f.x2,f.y2)}g.stroke();g.globalAlpha=1}
  g.restore();
  // HUD
  g.fillStyle='#fff';g.font='bold 15px system-ui';g.textAlign='left';
  g.fillText(`Nv ${P.lvl}   ⚔ ${P.k} / ☠ ${B.k}   ${Math.floor(time/60)}:${String(Math.floor(time%60)).padStart(2,'0')}`,12,22);
  bar(72,30,120,6,P.xp/(P.lvl*100),'#fd4');
  const mw=Math.min(220,vw*.4),mx=vw/2-mw/2;g.fillStyle='#0008';g.fillRect(mx,8,mw,16);
  for(const u of U){if(u.dead)continue;g.fillStyle=u==P?'#ff0':COL[u.team];const s=u.t=='mel'||u.t=='rng'?3:6;g.fillRect(mx+u.x/W*mw-s/2,16-s/2,s,s)}
  if(joy){g.strokeStyle='#fff6';g.lineWidth=3;g.beginPath();g.arc(joy.x,joy.y,50,0,7);g.stroke();g.fillStyle='#fff8';g.beginPath();g.arc(joy.x+jx*50,joy.y+jy*50,22,0,7);g.fill()}
  g.textAlign='center';
  if(P.dead){g.font='bold 26px system-ui';g.fillText('Renascendo em '+Math.ceil(P.dead),vw/2,vh/2)}
  if(time<8){g.font='14px system-ui';g.fillText('Arraste à esquerda para andar • Destrua a torre e o núcleo vermelho',vw/2,vh-12)}
  for(const[k,c,l]of[['q',P.q,'Q'],['w',P.w,'W'],['r',P.u,'R']]){const e=$(k),lock=k=='r'&&P.lvl<3,t=lock?'Nv3':c>0?Math.ceil(c):l;if(e.textContent!=t)e.textContent=t;e.classList.toggle('off',lock||c>0)}
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(!over)update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
